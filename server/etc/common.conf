# MOJ server — configuração base (sourced por lib/common.sh).
# Usa `: "${VAR:=default}"` para que variáveis de ambiente tenham precedência
# (permite override em testes e por instância). Ajuste os caminhos por deploy.

: "${CONTESTSDIR:=/home/ribas/moj/contests}"      # dados dos contests (fonte da verdade)
: "${RUNDIR:=/home/ribas/moj/run}"                # estado de runtime (não versionado)
: "${SESSIONDIR:=$RUNDIR/sessions}"               # sessões (tokens) — modo 700
: "${SPOOLDIR:=$RUNDIR/spool/submissions}"        # fila de submissões (daemon consome)
: "${SPOOLDONEDIR:=$RUNDIR/spool/submissions-done}"
: "${NEWSDIR:=/home/ribas/moj/cdmoj/server/var/news}"   # notícias (JSON por arquivo)
: "${BASEURL:=/api/v1}"
: "${DEFAULT_SCORE_MODE:=icpc}"                   # default p/ contests sem CONTEST_TYPE
: "${UNAME_CHANGE_LIMIT:=2}"                       # trocas de username permitidas por ano (treino)
: "${PROBLEM_STATS_TTL_MIN:=10}"                   # cache de estatísticas por problema (minutos)

# Telegram (overlay do treino: cadastro web-first + alertas)
: "${TELEGRAM_BOT_USERNAME:=mojinho_bot}"          # @username do bot (deep-link t.me/<bot>?start=…)
: "${BOT_TOKEN_FILE:=$RUNDIR/secrets/bot.token}"   # token do bot p/ a API (mojb_…) — modo 600
: "${TELEGRAM_CHANGE_LIMIT:=1}"                    # desvínculos de Telegram por ano (anti conta-descartável; .admin livre)
# Endereço PÚBLICO do site, p/ mensagens que saem da API (DM do mojinho). Fora de uma requisição
# — varredura, daemon — não há `Host:` p/ deduzir o hostname; por isso é config, como o @username.
: "${MOJ_PUBLIC_BASE:=https://moj.naquadah.com.br}"
: "${ALERT_CLAIM_MAX:=30}"                         # itens do outbox entregues por poll (~30 msg/s é o teto do Telegram)

# Convite de time: aviso do mojinho (lib/invite-notify.sh)
: "${REG_REMIND_LEAD:=86400}"        # s antes do fechamento p/ o "último aviso" (24 h)
: "${REG_REMIND_MIN_GAP:=21600}"     # s mínimos entre o DM do convite e o último aviso (6 h)
: "${INVITE_SWEEP_THROTTLE:=300}"    # s entre varreduras de convite pendente (o poll do bot é o relógio)

# Storage de problemas (MOJ-nativo: repo git LOCAL por problema em <org>/<prob>; lib/orgs.sh)
: "${MOJ_PROBLEMS_DIR:=/home/ribas/moj/moj-problems}"   # árvore dos pacotes (juízes/validador leem daqui)
: "${MOJTOOLS_DIR:=/home/ribas/moj/mojtools}"   # scripts de pipeline (validate/gen-json/owners)
: "${PROBLEM_OWNERS_TTL_MIN:=30}"               # frescor do índice de donos (regen em background)
