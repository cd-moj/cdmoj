<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  cdmoj/deploy/fontconfig/60-moj-cmu-math.conf — instalado em /etc/fonts/conf.d/ pela imagem.

  Os documentos da prova (caderno, editorial, info sheet — lib/contest-docs.sh) são escritos em CMU
  Serif/Sans/Typewriter (Computer Modern), que não têm boa parte dos símbolos de matemática (⊕ ⋅ ≤ ∑ ∣ ∈
  ′ …). Quando falta o glifo, o LibreOffice pede ao fontconfig um substituto e o que vinha era o "serif"
  padrão do sistema — DejaVu Serif no LibreOffice 25.2 da imagem (no 26.2 do dev, DejaVu Sans): um
  símbolo de outro desenho e de outro peso no meio de um texto com cara de LaTeX.

  Aqui a Latin Modern Math (do pacote fonts-lmodern, o MESMO desenho da matemática do LaTeX) entra na fila
  LOGO DEPOIS da família pedida. O fontconfig casa primeiro pela cobertura do caractere e depois pela
  ordem das famílias: para o que a CMU tem, nada muda; para o que falta, vem a Latin Modern Math antes
  do DejaVu. Asserção no deploy/Containerfile; prova no papel em server/test/render-docs.sh.
-->
<fontconfig>
  <alias binding="same"><family>CMU Serif</family><accept><family>Latin Modern Math</family></accept></alias>
  <alias binding="same"><family>CMU Sans Serif</family><accept><family>Latin Modern Math</family></accept></alias>
  <alias binding="same"><family>CMU Typewriter Text</family><accept><family>Latin Modern Math</family></accept></alias>
</fontconfig>
