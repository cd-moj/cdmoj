<!DOCTYPE html>
<html lang="pt-br" data-en-doctitle="Submission — Contest — MOJ" data-es-doctitle="Envío — Competencia — MOJ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submissão — Contest — MOJ</title>
  <link rel="stylesheet" href="/shared/ui.css">
  <link rel="icon" type="image/svg+xml" href="/shared/assets/logo_moj.svg">
  <style>
    .contest-topbar-title { font-weight:800; font-size:1.25rem; }
    .quicknav a.active { text-decoration:underline; }
    .run-find { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin-bottom:.8rem; }
    .run-find input { max-width:22rem; font-family:var(--mono, monospace); }
    .run-facts { display:grid; grid-template-columns:max-content 1fr; gap:.3rem 1rem; margin:.6rem 0 1rem; }
    .run-facts dt { color:var(--muted, #64748b); font-size:.9rem; }
    .run-facts dd { margin:0; }
    .run-id { font-family:var(--mono, monospace); font-size:.95rem; word-break:break-all; }
    .run-report { width:100%; height:70vh; border:1px solid var(--line, #e2e8f0); border-radius:8px; background:#fff; }
    .run-code .cm-editor { max-height:70vh; }
    tr.first-fail td { font-weight:700; }
    @media (max-width: 820px) { .run-facts { grid-template-columns:1fr; } .run-facts dt { margin-top:.4rem; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="bar" style="flex-direction:column; align-items:stretch; gap:.4rem">
      <div class="contest-topbar-title" id="contestTitle">…</div>
      <div class="row" style="align-items:center">
        <a class="brand" href="/" style="font-size:1rem"><img src="/shared/assets/logo_moj.svg" alt="MOJ"> MOJ
          <span class="badge-beta">BETA</span></a>
        <div class="spacer"></div>
        <span class="countdown" id="contestCountdown"></span>
        <a class="btn ghost" id="backBtn" href="#" data-en="Contest" data-es="Competencia">Contest</a>
      </div>
    </div>
  </header>
  <nav class="quicknav"><div class="bar" id="contestNav"></div></nav>

  <main class="container">
    <div class="section" id="runContainer"><span class="muted" data-en="Loading…" data-es="Cargando…">carregando…</span></div>
  </main>
  <script type="module" src="/shared/i18n-dom.js"></script>
  <script type="module" src="./run.js"></script>
</body>
</html>
