<!DOCTYPE html>
<html lang="pt-br" data-en-doctitle="Scoreboard reveal — MOJ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revelação do placar — MOJ</title>
  <link rel="stylesheet" href="/shared/ui.css">
  <link rel="icon" type="image/svg+xml" href="/shared/assets/logo_moj.svg">
  <style>
    body { background:#0f172a; }
    .wrap { max-width:1200px; margin:1rem auto; padding:0 1rem; }
    h1 { color:#fff; font-size:1.3rem; margin:.4rem 0 .8rem; }
    #status { color:#e2e8f0; }
    .muted { color:#94a3b8; }
    /* placar: CSS único em /shared/ui.css (não rola para o lado, colunas por colgroup) */
    tr.placing-up td { animation:flash-up 1.1s ease; }
    tr.placing-down td { animation:flash-down 1.1s ease; }
    @keyframes flash-up { 0%{background:#d7f5dd;} 100%{background:transparent;} }
    @keyframes flash-down { 0%{background:#fde0e4;} 100%{background:transparent;} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 data-en="🏆 Scoreboard reveal">🏆 Revelação do placar</h1>
    <div id="app" data-en="Loading…">Carregando…</div>
  </div>
  <script type="module" src="/shared/i18n-dom.js"></script>
  <script type="module" src="./reveal.js"></script>
</body>
</html>
