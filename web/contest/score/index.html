<!DOCTYPE html>
<html lang="pt-br" data-en-doctitle="Scoreboard — Contest — MOJ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Placar — Contest — MOJ</title>
  <link rel="stylesheet" href="/shared/ui.css">
  <link rel="icon" type="image/svg+xml" href="/shared/assets/logo_moj.svg">
  <style>
    .contest-topbar-title { font-weight:800; font-size:1.25rem; }
    .quicknav a.active { text-decoration:underline; }
    /* o CSS do placar (largura fixa por colgroup, quebra de linha, marca no celular) mora em
       /shared/ui.css — é o MESMO da cerimônia e do relatório offline. Aqui fica só o que é
       desta página. */
    /* animação de mudança de posição */
    tr.placing-up td { animation:flash-up 1.1s ease; }
    tr.placing-down td { animation:flash-down 1.1s ease; }
    @keyframes flash-up { 0%{background:#d7f5dd;} 100%{background:transparent;} }
    @keyframes flash-down { 0%{background:#fde0e4;} 100%{background:transparent;} }
    .region-bar { margin-bottom:.8rem; }
    .region-bar a { margin-right:.3rem; }
    .region-bar a.active { font-weight:800; text-decoration:underline; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="bar" style="flex-direction:column; align-items:stretch; gap:.4rem">
      <div class="contest-topbar-title" id="contestTitle">…</div>
      <div class="row" style="align-items:center">
        <a class="brand" href="/" style="font-size:1rem"><img src="/shared/assets/logo_moj.svg" alt="MOJ"> MOJ
          <span class="badge-beta">BETA</span></a>
        <div class="spacer"></div>
        <span class="countdown" id="contestCountdown"></span>
        <a class="btn ghost" id="backBtn" href="#">Contest</a>
      </div>
    </div>
  </header>

  <nav class="quicknav"><div class="bar" id="contestNav"></div></nav>

  <main class="container">
    <div class="section notice hidden" id="publicNotice" data-en="You are viewing the scoreboard in public mode (restricted or delayed data).">
      Você está visualizando o placar em modo público (dados restritos ou atrasados).
    </div>
    <div class="section notice hidden" id="prestartNotice">
      ⏳ <span data-en="The contest has not started yet — this is the roster of registered teams; the full scoreboard appears when it starts. Starts in: ">A competição ainda não começou — este é o quadro de times inscritos; o placar completo aparece no início. Começa em: </span><b id="prestartLeft"></b>
    </div>
    <div class="section">
      <div class="row" style="margin-bottom:.6rem">
        <input id="scoreSearch" placeholder="🔍 Buscar time / universidade / login…" data-en-ph="🔍 Search team / university / login…" style="flex:1; min-width:240px">
        <label class="small"><input type="checkbox" id="noAnim"> <span data-en="Disable animation">Desabilitar animação</span></label>
      </div>
      <div class="region-bar hidden" id="regionBar"></div>
      <div class="region-bar hidden" id="metaFilterBar" style="gap:.5rem"></div>
      <div id="scoreContainer"><span class="muted" data-en="Loading…">carregando…</span></div>
    </div>
  </main>

  <script type="module" src="/shared/i18n-dom.js"></script>
  <script type="module" src="./score.js"></script>
</body>
</html>
